plugins { id 'fabric-loom' version "${loom_version}"; id 'java' }
version = project.mod_version; group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
def instMods = "C:/Users/basma/curseforge/minecraft/Instances/Middle-earth - Age of Adventure/mods"
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Compile-only interop with the base Middle-earth mod (present in the instance, not on Maven):
    modCompileOnly files("${instMods}/SevenStarsAPI-1.0.1-1.21.8-beta.jar")
    modCompileOnly files("${instMods}/Middle-earth-1.0.1-1.21.8-beta.jar")
    // The base mod on the test classpath as well, so a test can check that the symbols our
    // mixins target still exist. Compile-only does not reach tests, and the inscriptions button
    // injects with require = 0 - a rename would cost the button silently without this.
    testImplementation files("${instMods}/Middle-earth-1.0.1-1.21.8-beta.jar")

    // Reads those class files out of the jar. Loading them is not an option: a screen class drags
    // in Minecraft's rendering hierarchy and fails verification outside a running game.
    testImplementation 'org.ow2.asm:asm:9.7'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
test { useJUnitPlatform() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }


// Renders every screen in a real client and photographs it - see UiScreenshotTest.
loom {
    runs {
        clientGameTest {
            client()
            name = "Client Game Test"
            property "fabric.client.gametest"
        }
        // Just the inscriptions page. The full client gametest runs five entrypoints and takes
        // minutes; this one boots, prints what the table resolved to, photographs it and stops.
        inscriptionsTest {
            client()
            name = "Inscriptions Test"
            property "fabric.client.gametest"
            property "kindreds.gametest.only", "inscriptions"
        }
        // Task 8a: server-side gametests with mock players fighting real mobs through real event
        // hooks - see the com.kindreds.gametest package. "fabric-api.gametest" is the real system
        // property (net.fabricmc.fabric.impl.gametest.GameTestSystemProperties.ENABLED, verified by
        // javap against fabric-gametest-api-v1 3.1.9 - NOT "fabric.gametest" or "fabric-api.gametest"
        // with a different separator, both of which would silently no-op this run).
        gametest {
            server()
            name = "Game Test"
            property "fabric-api.gametest"
        }
    }
}
